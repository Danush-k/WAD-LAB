<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bingo Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    <h1>Bingo Game</h1>

    <!-- Player Bingo Cards -->
    <div class="boards-container">
      <div class="player-section">
        <h2>Player 1's Card</h2>
        <div id="board1" class="board"></div>
      </div>

      <div class="player-section">
        <h2>Player 2's Card</h2>
        <div id="board2" class="board"></div>
      </div>
    </div>

    <!-- Game Controls -->
    <div class="controls">
      <div class="action-buttons">
        <button id="startBtn" onclick="startGame()">Start</button>
        <button id="resetBtn" onclick="resetGame()">Reset</button>
      </div>

      <div class="input-section">
        <label for="numberInput">Enter a number (1-25): </label>
        <input type="number" id="numberInput" min="1" max="25" disabled>
        <button id="markBtn" onclick="markNumber()" disabled>Mark</button>
      </div>

      <p id="turnStatus">Click "Start" to play!</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
